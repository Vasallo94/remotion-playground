services:
  render-service:
    build:
      context: .
      dockerfile: packages/render-service/Dockerfile
    ports:
      - "3100:3100"
    volumes:
      - ./src:/app/src
      - ./content:/app/content
      - ./public/audio:/app/public/audio
      - ./public/voiceover:/app/public/voiceover
      - ./.generated:/app/.generated
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/api/render/jobs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  agent-pi:
    build:
      context: .
      dockerfile: packages/agent-pi/Dockerfile
    ports:
      - "3200:3200"
    volumes:
      - ./src:/app/src
      - ./content:/app/content
      - ./public/audio:/app/public/audio
      - ./public/voiceover:/app/public/voiceover
      - ./.generated:/app/.generated
      - ${HOME}/.pi/agent/auth.json:/root/.pi/agent/auth.json:ro
      - ${HOME}/.pi/agent/models.json:/root/.pi/agent/models.json:ro
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./gemini_flash_tts_testing_sa.json}:/run/secrets/google-service-account.json:ro
    env_file: .env
    environment:
      - PROJECT_ROOT=/app
      - RENDER_URL=http://render-service:3100
      - AGENT_PI_DB=/app/.generated/claqueta-pi/agent-pi.db
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_BASE_URL=${AZURE_OPENAI_BASE_URL:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-}
      - AZURE_OPENAI_DEPLOYMENT_NAME_MAP=${AZURE_OPENAI_DEPLOYMENT_NAME_MAP:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/google-service-account.json
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-vertexlda}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-global}
      - CLAQUETA_PI_MODEL=${CLAQUETA_PI_MODEL:-azure-openai/gpt-5.6-sol:low}
      - CLAQUETA_PI_MODEL_INTAKE=${CLAQUETA_PI_MODEL_INTAKE:-azure-openai/gpt-5.6-luna:low}
      - CLAQUETA_PI_MODEL_RESEARCH=${CLAQUETA_PI_MODEL_RESEARCH:-azure-openai/gpt-5.6-luna:low}
      - CLAQUETA_PI_MODEL_NARRATIVE=${CLAQUETA_PI_MODEL_NARRATIVE:-azure-openai/gpt-5.6-sol:low}
      - CLAQUETA_PI_MODEL_DIRECTION=${CLAQUETA_PI_MODEL_DIRECTION:-azure-openai/gpt-5.6-sol:low}
      - CLAQUETA_PI_MODEL_AUDIO_PLAN=${CLAQUETA_PI_MODEL_AUDIO_PLAN:-azure-openai/gpt-5.6-luna:low}
      - CLAQUETA_PI_MODEL_SCENE_QA=${CLAQUETA_PI_MODEL_SCENE_QA:-google-vertex/gemini-2.5-flash:low}
      - CLAQUETA_PI_MODEL_SCENE_CREATION=${CLAQUETA_PI_MODEL_SCENE_CREATION:-azure-openai/gpt-5.6-luna:low}
      - CLAQUETA_PI_MODEL_CONFIG=${CLAQUETA_PI_MODEL_CONFIG:-azure-openai/gpt-5.6-luna:low}
      - CLAQUETA_PI_MODEL_VALIDATION=${CLAQUETA_PI_MODEL_VALIDATION:-azure-openai/gpt-5.6-luna:low}
    depends_on:
      render-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3200/api/pi/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    ports:
      - "5173:5173"
    env_file: .env
    environment:
      - VITE_AGENT_RUNTIME=pi
      - VITE_AGENT_PI_URL=http://localhost:3200
      - VITE_RENDER_URL=http://localhost:3100
    depends_on:
      agent-pi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
